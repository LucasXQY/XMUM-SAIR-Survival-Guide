# 小帮手的 Cloudflare Worker 配置。部署由 .github/workflows/assistant.yml 完成，见 assistant/README.md
# Cloudflare Worker config for the helper. Deployed by .github/workflows/assistant.yml; see assistant/README.md
name = "xmum-sair-assistant"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Smart Placement：Cloudflare 测出更快时，把 Worker 挪到离它调用的服务（Claude API 等）更近的机房运行；同学仍然连离自己最近的机房。
# 也让在 Claude 不服务的地区（如香港）的同学，请求不从当地机房发往 Claude。部署后最多 15 分钟生效，流量少时可能不挪。
# Smart Placement: when Cloudflare measures it is faster, the Worker runs nearer the services it calls (the Claude API and
# others); visitors still connect to their nearest data center. It also keeps calls to Claude from leaving a data center in a
# region Claude does not serve (e.g. Hong Kong). Takes up to 15 minutes after a deploy; with little traffic it may not move.
[placement]
mode = "smart"

[vars]
ALLOWED_ORIGINS = "https://xmum-sair.github.io,http://localhost:8767"
PER_VISITOR_DAILY = "15"   # questions per visitor per day
GLOBAL_DAILY = "150"       # questions for the whole site per day
HELPER_USD_DAY = "2"       # dollar cap per UTC day (the deploy workflow overrides it from the repository variable HELPER_USD_DAY)
HELPER_USD_MONTH = "60"    # dollar cap per UTC month (repository variable HELPER_USD_MONTH)
FORUM_USD_DAY = "0.5"      # the discussion area's check, dollars per UTC day (repository variable FORUM_USD_DAY)
FORUM_USD_MONTH = "5"      # and per UTC month (repository variable FORUM_USD_MONTH)
PAUSED = "0"               # the deploy workflow sets 1 when the repository variable BOTS_PAUSED is 1

# one Durable Object keeps the daily counts (SQLite-backed: available on the free plan)
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# the course reviews: votes in one SQLite-backed Durable Object (src/reviews.js, src/worker.js)
[[durable_objects.bindings]]
name = "REVIEWS"
class_name = "Reviews"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Reviews"]

# the opportunity wall and experience posts: one SQLite-backed Durable Object (src/board.js, src/worker.js)
[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Board"]

# the discussion area: threads, replies, reports and today's counters in one SQLite-backed Durable Object (src/forum.js)
[[durable_objects.bindings]]
name = "FORUM"
class_name = "Forum"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Forum"]
