name: lecturers

# 评价里出现、课程 README 里没有的老师：机器人开（或更新）一个 PR 把他们加进对应课程，维护者确认后合并。见 reviews/lecturers.py
# Lecturers named in reviews but missing from the course READMEs: the bot opens or updates a PR adding them; a
# maintainer merges it. See reviews/lecturers.py
on:
  schedule:
    - cron: "30 1 * * 1"    # Mondays, after the link check
  workflow_dispatch:

permissions:
  contents: write          # the bot/new-lecturers branch and the pending list on bot-state
  pull-requests: write

concurrency:
  group: lecturers
  cancel-in-progress: false

jobs:
  propose:
    if: vars.BOTS_PAUSED != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*/*/README.md
            /reviews/
            /llm/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          GH_TOKEN: ${{ github.token }}
          ASSISTANT_URL: ${{ vars.ASSISTANT_URL }}               # the reviews live on the Worker since 2026-11-06
          REVIEWS_ADMIN_TOKEN: ${{ secrets.REVIEWS_ADMIN_TOKEN }}
        run: python reviews/lecturers.py
