name: moderation

# 评论审核：网站问答的评论（Discussions）、Issue 及其评论，按关键词表折叠辱骂、歧视和政治敏感内容并记日志。见 moderation/DESIGN.md
# Comment moderation: Discussions (the site's Q&A), issues and their comments are checked against the
# word lists; abusive, discriminatory or politically sensitive content is folded and logged. See moderation/DESIGN.md
on:
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write        # only for the Claude call counter on the bot-state branch (llm/claude_check.py)
  discussions: write
  issues: write
  pull-requests: write

jobs:
  scan:
    if: vars.BOTS_PAUSED != '1' && github.actor != 'github-actions[bot]' && github.actor != 'giscus[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            moderation
            llm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "anthropic>=2.6,<3"
      - env:
          GH_TOKEN: ${{ github.token }}
          # Claude's second opinion on keyword hits; without the key the keyword rules work alone
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL_MODERATION: ${{ vars.CLAUDE_MODEL_MODERATION }}
          CLAUDE_DAILY_MODERATION: ${{ vars.CLAUDE_DAILY_MODERATION }}
        run: python moderation/moderation.py --event "$GITHUB_EVENT_PATH"
