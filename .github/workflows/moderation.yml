name: moderation

# 评论审核：Issue 及其评论按关键词表折叠辱骂、歧视和政治敏感内容并记日志（网站讨论区在 Worker 里先审后发，见 assistant/src/forum.js）。见 moderation/DESIGN.md
# Comment moderation: issues and their comments are checked against the word lists; abusive, discriminatory or
# politically sensitive content is folded and logged (the site's discussion area is checked in the Worker before
# anything appears: assistant/src/forum.js). See moderation/DESIGN.md
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write        # only for the Claude call counter on the bot-state branch (llm/claude_check.py)
  issues: write
  pull-requests: write

jobs:
  scan:
    if: vars.BOTS_PAUSED != '1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            moderation
            llm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "anthropic>=2.6,<3"
      - env:
          GH_TOKEN: ${{ github.token }}
          # Claude's second opinion on keyword hits; without the key the keyword rules work alone
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL_MODERATION: ${{ vars.CLAUDE_MODEL_MODERATION }}
          CLAUDE_DAILY_MODERATION: ${{ vars.CLAUDE_DAILY_MODERATION }}
          CLAUDE_USD_DAY_HAIKU: ${{ vars.CLAUDE_USD_DAY_HAIKU }}
          CLAUDE_USD_MONTH_HAIKU: ${{ vars.CLAUDE_USD_MONTH_HAIKU }}
        run: python moderation/moderation.py --event "$GITHUB_EVENT_PATH"
