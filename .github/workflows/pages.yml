name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # the discussion page lists posts by board: rebuild when posts, their labels or their comments change
  discussion:
    types: [created, edited, deleted, labeled, unlabeled, locked, unlocked]
  discussion_comment:
    types: [created, deleted]

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

# pull-request builds get a group each; every deploy of main shares one, and a newer deploy (say, a burst of comments)
# replaces an older one still waiting or running, since both build the same main
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages-deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the "recent uploads" list reads each file's first-added date from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python site/fetch_discussions.py _data/discussions.json
      - run: python site/build.py
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
