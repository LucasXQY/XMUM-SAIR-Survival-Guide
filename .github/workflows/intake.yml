name: intake

# 上传通道：把带 upload 标签的 Issue 整理成 PR；main 有新提交时给每个打开的上传各启动一次重建；维护者在上传 Issue 或它的 PR 下
# 留 /place、/skip、/keep、/approve、/retry 指令。见 intake/DESIGN.md 与 intake/AI-PIPELINE.md
# Upload channel: turns an issue labelled `upload` into a pull request; every push to main starts one rebuild per open
# upload; maintainers steer an upload with /place, /skip, /keep, /approve and /retry comments. See intake/DESIGN.md and
# intake/AI-PIPELINE.md
#
# Every rebuild of issue n runs in concurrency group intake-<n> (issue events, dispatches, commands), so two rebuilds of
# one upload never overlap. GitHub keeps one running and one pending run per group and cancels an older pending one:
# that is harmless for rebuilds (each starts from the issue, main and the cache), so whatever must not be lost, the
# maintainers' commands, is stored before that, in the ungrouped `command-target` job.
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to rebuild"
        required: true
        type: string
      sweep:
        description: "Started by the push sweep: stay quiet when the form is still invalid and already answered"
        required: false
        type: boolean
        default: false
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write     # the failing `intake/待整理` status that holds a PR back

jobs:
  intake:
    if: >-
      vars.BOTS_PAUSED != '1' && (
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'upload'))
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: intake-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pymupdf>=1.24,<2" "markdown>=3.4,<4" "anthropic>=2.6,<3"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install LibreOffice (Office files are converted to PDF for the AI)
        run: if ! command -v soffice >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc; fi
      - name: Rebuild the upload pull request
        env:
          GH_TOKEN: ${{ github.token }}
          # Claude sorts each file and compares near-duplicates (CLAUDE_MODEL_SORT), checks every page and re-checks the
          # blacked-out pages (CLAUDE_MODEL_UPLOAD); without the key only cached results count, and every other file
          # waits under "Needs you"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL_SORT: ${{ vars.CLAUDE_MODEL_SORT }}
          CLAUDE_MODEL_UPLOAD: ${{ vars.CLAUDE_MODEL_UPLOAD }}
          CLAUDE_USD_DAY_UPLOAD: ${{ vars.CLAUDE_USD_DAY_UPLOAD }}
          CLAUDE_USD_MONTH_UPLOAD: ${{ vars.CLAUDE_USD_MONTH_UPLOAD }}
          CLAUDE_USD_RUN_UPLOAD: ${{ vars.CLAUDE_USD_RUN_UPLOAD }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          SWEEP: ${{ inputs.sweep }}
        run: |
          if [ "$SWEEP" = true ]; then
            python intake/intake.py --issue "$ISSUE" --sweep
          else
            python intake/intake.py --issue "$ISSUE"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thumbnails
          path: _intake/thumbs
          if-no-files-found: ignore

  # On every push to main: one workflow_dispatch run per open upload (open upload PRs, and upload issues the bot has
  # not answered), so each rebuild queues in its own issue's group instead of racing that issue's other runs.
  sweep:
    if: vars.BOTS_PAUSED != '1' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write          # GITHUB_TOKEN may start workflow_dispatch runs
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start one rebuild per open upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python intake/intake.py --dispatch-open

  # The maintainer's command is stored (and answered with 👍 or a reply) here, outside any concurrency group, so a
  # queued rebuild can never cancel it; the job outputs the upload issue to rebuild (a PR comment names the PR, the
  # issue number comes from its head branch upload/issue-<n>), empty when there is nothing to do.
  command-target:
    if: >-
      vars.BOTS_PAUSED != '1' && github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      issue: ${{ steps.store.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: store
        name: Store the command
        env:
          GH_TOKEN: ${{ github.token }}
        # the comment is read from the event file by the script (author, permission, thread), never pasted into the shell
        run: python intake/intake.py --comment-event "$GITHUB_EVENT_PATH"

  command:
    needs: command-target
    if: >-
      vars.BOTS_PAUSED != '1' && github.event_name == 'issue_comment' && needs.command-target.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: intake-${{ needs.command-target.outputs.issue }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pymupdf>=1.24,<2" "markdown>=3.4,<4" "anthropic>=2.6,<3"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install LibreOffice (Office files are converted to PDF for the AI)
        run: if ! command -v soffice >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc; fi
      - name: Rebuild after the command
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL_SORT: ${{ vars.CLAUDE_MODEL_SORT }}
          CLAUDE_MODEL_UPLOAD: ${{ vars.CLAUDE_MODEL_UPLOAD }}
          CLAUDE_USD_DAY_UPLOAD: ${{ vars.CLAUDE_USD_DAY_UPLOAD }}
          CLAUDE_USD_MONTH_UPLOAD: ${{ vars.CLAUDE_USD_MONTH_UPLOAD }}
          CLAUDE_USD_RUN_UPLOAD: ${{ vars.CLAUDE_USD_RUN_UPLOAD }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE: ${{ needs.command-target.outputs.issue }}
        run: python intake/intake.py --issue "$ISSUE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thumbnails
          path: _intake/thumbs
          if-no-files-found: ignore

  # A closed upload PR, merged or not, drops its AI cache from bot-state. A rejected upload must not stay on a public
  # branch either: the branch of a PR closed without merging is deleted ("Automatically delete head branches" only
  # covers merged ones). Only PRs from this repository count: a fork's branch may carry the same name.
  cleanup:
    if: >-
      vars.BOTS_PAUSED != '1' && github.event_name == 'pull_request_target'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'upload/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete the branch of a PR closed without merging
        if: github.event.pull_request.merged == false
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
      - name: Delete the upload's cache from bot-state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          n="${BRANCH#upload/issue-}"
          case "$n" in ''|*[!0-9]*) echo "not an upload branch"; exit 0;; esac
          path="intake-cache/issue-$n.json"
          if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=bot-state" -q .sha 2>err.txt); then
            if grep -q "404" err.txt; then echo "no cache for #$n"; exit 0; fi
            cat err.txt; exit 1
          fi
          if ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/contents/$path" -f message="intake-cache: drop issue $n" \
               -f branch=bot-state -f sha="$sha" > /dev/null 2>err.txt; then
            if grep -q "404" err.txt; then echo "cache already gone"; exit 0; fi
            cat err.txt; exit 1
          fi
          echo "dropped $path"
