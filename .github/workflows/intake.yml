name: intake

# 上传通道：把带 upload 标签的 Issue 整理成 PR；main 有新提交时把所有打开的上传 PR 重建一遍。见 intake/DESIGN.md
# Upload channel: turns an issue labelled `upload` into a pull request; every push to main rebuilds all open upload PRs. See intake/DESIGN.md
on:
  issues:
    types: [opened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to rebuild"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

# one rebuild at a time, queued, never cancelled: two runs must not race on the same branch
concurrency:
  group: intake
  cancel-in-progress: false

jobs:
  intake:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'upload')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf markdown
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Rebuild upload pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          if [ "$EVENT" = push ]; then
            python intake/intake.py --all-open
          else
            python intake/intake.py --issue "$ISSUE"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thumbnails
          path: _intake/thumbs
          if-no-files-found: ignore
