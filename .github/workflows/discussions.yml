name: discussions

# 讨论区分板块：新帖按标题前缀或 Claude（默认 Haiku）贴上板块标签，提到某门课的再加课程标签。见 discussions/boards.py
# Discussion boards: a new post gets a board label (title prefix or Claude, Haiku by default) and a course label when it
# names one course. See discussions/boards.py
on:
  discussion:
    types: [created, edited]

permissions:
  contents: write        # only for the Claude call counter on the bot-state branch (llm/claude_check.py)
  discussions: write
  issues: write          # labels live in the issue label list
  actions: write         # labels set with this token start no workflow, so the site rebuild is requested by hand

jobs:
  label:
    if: vars.BOTS_PAUSED != '1' && github.event.discussion.user.login != 'giscus' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: discussions-${{ github.event.discussion.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            discussions
            llm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "anthropic>=2.6,<3"
      - env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL_CLASSIFY: ${{ vars.CLAUDE_MODEL_CLASSIFY }}
          CLAUDE_DAILY_CLASSIFY: ${{ vars.CLAUDE_DAILY_CLASSIFY }}
          CLAUDE_USD_DAY_HAIKU: ${{ vars.CLAUDE_USD_DAY_HAIKU }}
          CLAUDE_USD_MONTH_HAIKU: ${{ vars.CLAUDE_USD_MONTH_HAIKU }}
        run: python discussions/boards.py --event "$GITHUB_EVENT_PATH"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
