name: downloads

# 每个课程学期打一个 zip，放到名为 downloads 的 Release 里；网站课程页的「打包下载」按钮指向这些文件。见 site/DESIGN.md §15
# One zip per course session, kept as assets of the release named `downloads`; the site's download buttons point here. See site/DESIGN.md §15
on:
  push:
    branches: [main]
    paths: ["EEE/**", "AIT/**", "ROBO/**", "scripts/make_zips.py", ".github/workflows/downloads.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads
  cancel-in-progress: true

jobs:
  zips:
    if: vars.BOTS_PAUSED != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/make_zips.py _zips
      - name: Upload to the downloads release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view downloads >/dev/null 2>&1 || gh release create downloads --latest=false \
            --title "按学期打包下载 | Session downloads" \
            --notes "每个课程学期一个 zip，由工作流自动更新；网站课程页的「打包下载」按钮指向这里。One zip per course session, rebuilt automatically; the download buttons on the site's course pages point here."
          gh release upload downloads _zips/*.zip --clobber
